<!doctype html>
<html lang="mg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>AVENIR — Fanovana mot de passe</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#173750;background:#f0f5f8}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:18px}main{width:100%;max-width:480px;background:white;border:1px solid #d6e5ef;border-radius:17px;box-shadow:0 8px 35px #182e4b15;padding:27px 22px}h1{font-size:23px;margin:0 0 6px}p{line-height:1.6;color:#566b7e}label{display:block;font-weight:700;font-size:13px;margin:18px 0 7px}input{padding:13px;border:1px solid #b9cad6;border-radius:9px;width:100%;font:inherit}button{display:block;width:100%;padding:13px;border:0;border-radius:9px;background:#235475;color:white;font:inherit;font-weight:750;margin-top:20px}button:disabled{opacity:.5}#status{margin-top:16px;background:#f0f6f9;border-radius:9px;padding:13px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}#status.err{background:#ffebed;color:#862b32}#status.ok{background:#e8f8ef;color:#146944}#form{display:none}.foot{font-size:12px;margin-bottom:0}
</style>
</head>
<body><main>
<h1>🔐 BULLETIN SCOLAIRE AVENIR</h1>
<p>Fanovana mot de passe amin'ny Supabase. Mampiasà ilay rohy <strong>Reset password</strong> nalefa tany amin'ny mailakao.</p>
<div id="status" role="status" aria-live="polite">Fanamarinana ilay rohy…</div>
<form id="form" autocomplete="off">
<label for="password">Mot de passe vaovao (8 caractères farafahakeliny)</label>
<input id="password" type="password" minlength="8" required autocomplete="new-password" placeholder="Mot de passe vaovao">
<label for="confirm">Avereno ny mot de passe</label>
<input id="confirm" type="password" minlength="8" required autocomplete="new-password" placeholder="Avereno eto">
<button id="submit" type="submit">Hanova mot de passe</button>
</form>
<p class="foot">Tsy mitahiry mot de passe ity pejy ity. Aza alefa amin'olona ny rohy misy token.</p>
</main>
<script>
'use strict';
const base='https://trxgqdhnevjzvkcuxbof.supabase.co';
const key='sb_publishable_cMno_LR9c001N7QMMDvqfQ_-t97Kpap';
const statusBox=document.getElementById('status');
const form=document.getElementById('form');
const btn=document.getElementById('submit');
const f=new URLSearchParams(location.hash.startsWith('#')?location.hash.slice(1):'');
const q=new URLSearchParams(location.search);
let bearer=f.get('access_token');
// Esory amin'ny adresse hita ny token avy hatrany (tsy tahirizina).
try { history.replaceState(null,'',location.pathname); } catch (_) {}
function show(msg,cls=''){statusBox.textContent=msg;statusBox.className=cls;}
async function check(){
  if(f.has('error')||q.has('error')){show('Tsy mandeha intsony na efa lany daty ilay rohy. Mangataha mail Reset password vaovao ao amin’ny Supabase.','err');return;}
  if(!bearer||f.get('type')!=='recovery'){
    show('Tsy hita ny rohy fanovana mot de passe. Sokafy ity pejy ity avy amin’ny mail « Reset your password » vaovao, fa tsy mivantana.');return;
  }
  try{
    const res=await fetch(base+'/auth/v1/user',{headers:{'apikey':key,'Authorization':'Bearer '+bearer}});
    if(!res.ok)throw Error('Rohy lany daty na tsy ekena');
    show('✅ Voamarina ny rohy. Manorata mot de passe vaovao etsy ambany.','ok');
    form.style.display='block';
  }catch(e){show('Tsy voamarina ny rohy. Mangataha Reset password vaovao. Jereo koa ny Internet.','err');}
}
form.addEventListener('submit',async (event)=>{
 event.preventDefault();
 const p=document.getElementById('password').value;
 const c=document.getElementById('confirm').value;
 if(p.length<8){show('Ataovy 8 caractères farafahakeliny ny mot de passe.','err');return;}
 if(p!==c){show('Tsy mitovy ireo mot de passe nosoratanao.','err');return;}
 btn.disabled=true;show('Mampiditra ny mot de passe vaovao…');
 try{
   const res=await fetch(base+'/auth/v1/user',{method:'PUT',headers:{'apikey':key,'Authorization':'Bearer '+bearer,'Content-Type':'application/json'},body:JSON.stringify({password:p})});
   const data=await res.json().catch(()=>({}));
   if(!res.ok)throw Error(typeof data.msg==='string'?data.msg:(data.message||data.error_description||data.error||'Tsy voarakitra'));
   document.getElementById('password').value='';document.getElementById('confirm').value='';
   form.style.display='none';bearer=null;
   show('✅ VITA! Voavao ny mot de passe. Miverena ao amin’ny application AVENIR → Synchronisation, ary midira amin’ny email sy mot de passe vaovao.','ok');
 }catch(e){show('Tsy vita: '+String(e.message||e).slice(0,180),'err');}
 finally{btn.disabled=false;}
});
check();
</script>
</body>
</html>
